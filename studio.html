<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="教材スタジオ">
  <title>教材スタジオ（試作）</title>
  <link rel="manifest" href="studio.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="studio.css">
</head>
<body class="studio">
  <main id="main"><div class="card center muted">読み込み中…</div></main>
  <div id="toast" hidden></div>
  <dialog id="dialog"></dialog>
  <script type="module">
    import { initUpdate } from './update-manager.js';
    import { mount } from './studio-main.js';
    document.documentElement.dataset.theme = 'dark';
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    // after Web Audio is used (decoding, speech recognition), iOS would mute video/audio when the silent switch is on; 'playback' keeps sound on
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
    mount(document.getElementById('main'), { base: '' });
    initUpdate();
  </script>
</body>
</html>
