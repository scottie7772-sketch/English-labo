<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e2236">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="English Lab">
  <title>English Learning Lab</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <script>
    // Apply the destination palette before the first paint, not after module loading.
    const initialRoute = (location.hash.slice(1) || 'home').split('?')[0];
    const brownRoutes = ['home','vocab','word','decks','vocab-bulk','vocab-csv','vocab-paste','datacheck','storage','review','log','settings'];
    document.documentElement.dataset.initialZone = brownRoutes.includes(initialRoute) ? 'brown' : '';
  </script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <script>document.body.dataset.zone = document.documentElement.dataset.initialZone || '';</script>
  <main id="main"><div class="card center muted">読み込み中…</div></main>
  <nav id="tabs"></nav>
  <div id="toast" hidden></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
